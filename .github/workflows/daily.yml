name: daily-forecast-and-pages

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = before the 12:00 CET day-ahead gate closure
    - cron: "20 11 * * *"   # retry slot; the log is immutable, so the first success wins
    - cron: "0 7 * * *"     # morning run: scores yesterday once Elia publishes actuals
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/daily.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: penumbra-daily
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Issue tomorrow's forecast and score past days
        run: python scripts/live_run.py
      - name: Commit append-only forecast log
        run: |
          git config user.name "penumbra-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/live
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "live: forecast log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: forecast
    if: ${{ !cancelled() && needs.forecast.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
