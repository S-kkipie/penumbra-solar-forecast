[project]
name = "penumbra"
version = "1.0.0"
description = "Calibrated day-ahead solar PV forecasting for the Belgian grid, benchmarked against the TSO's operational forecast."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "pvlib>=0.11",
  "requests>=2.31",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "python-pptx>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*dayofyear.*"]
